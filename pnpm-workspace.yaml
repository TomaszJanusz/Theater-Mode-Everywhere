# Share one dependency tree across worktrees; pnpm turns this off in CI.
virtualStoreType: global

# Skip versions younger than 3 days (minutes) so a hijacked release is usually pulled before we install it.
minimumReleaseAge: 4320

# Refuse a version whose publish trust evidence is weaker than an earlier release's.
trustPolicy: no-downgrade
# Types-only dependency of @types/node 20; this release has no publish attestation. Drop when @types/node moves past it.
trustPolicyExclude:
  - undici-types@6.21.0

# Transitive dependencies may not use git repositories or direct tarball URLs; only direct dependencies may.
blockExoticSubdeps: true

# Fail the install when a dependency has an unreviewed build script.
strictDepBuilds: true

# esbuild is the only package allowed to run a build script.
allowBuilds:
  esbuild: true

# A stale node_modules warns instead of silently reinstalling.
verifyDepsBeforeRun: warn

overrides:
  # Keep import-x on its pure-JavaScript resolver; avoid resolve 2's
  # semver 6 dependency, which fails the no-downgrade trust policy.
  eslint-plugin-import-x>eslint-import-resolver-node: 0.3.9
  # GHSA-g3hv-75wg-m249 (glob-pattern amplification), fixed only in minimatch 11.0.1. Lifts the
  # 9.x/10.x copies of typescript-estree, eslint-plugin-sonarjs and eslint-plugin-import-x to 11.
  # import-x 4.6.1's no-internal-modules rule calls makeRe(), which minimatch 11 removed; keep that
  # rule off while this override applies. Drop it once those consumers accept minimatch 11 themselves.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  # GHSA-fxqj-rqcc-2cmp and GHSA-r28c-9q8g-f849; drop once no consumer resolves postcss <= 8.5.22.
  postcss: 8.5.23
  # GHSA-68fv-2mgg-jv7q; drop once no consumer resolves source-map-js < 1.2.2.
  source-map-js: 1.2.2
patchedDependencies:
  '@privacy-thing/brand@0.2.1': patches/@privacy-thing__brand@0.2.1.patch
  # Interaction tests only: hide addon coverage and ignore its saved toggle. 10.6.2 has no disable option;
  # its reporter's require(ESM) export is incompatible with Vitest 5's dynamic-import reporter loader.
  '@storybook/addon-vitest@10.6.2': patches/@storybook__addon-vitest@10.6.2.patch
packageExtensions:
  # dependency-cruiser parses TypeScript only when it can resolve `typescript` from its own
  # directory; with the shared virtual store it otherwise cruises nothing and reports no violations.
  dependency-cruiser:
    peerDependencies:
      typescript: '>=2.0.0 <7.0.0'
