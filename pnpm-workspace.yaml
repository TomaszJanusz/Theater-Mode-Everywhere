# Share one dependency tree across worktrees; pnpm turns this off in CI.
virtualStoreType: global

# Skip versions younger than 3 days (minutes) so a hijacked release is usually pulled before we install it.
minimumReleaseAge: 4320

# Refuse a version whose publish trust evidence is weaker than an earlier release's.
trustPolicy: no-downgrade
# Types-only dependency of @types/node 20; this release has no publish attestation. Drop when @types/node moves past it.
trustPolicyExclude:
  - undici-types@6.21.0

# Transitive dependencies may not use git repositories or direct tarball URLs; only direct dependencies may.
blockExoticSubdeps: true

# Fail the install when a dependency has an unreviewed build script.
strictDepBuilds: true

# esbuild is the only package allowed to run a build script.
allowBuilds:
  esbuild: true

# A stale node_modules warns instead of silently reinstalling.
verifyDepsBeforeRun: warn

overrides:
  # Keep import-x on its pure-JavaScript resolver; avoid resolve 2's
  # semver 6 dependency, which fails the no-downgrade trust policy.
  eslint-plugin-import-x>eslint-import-resolver-node: 0.3.9
  brace-expansion: 2.1.7
  postcss: 8.5.23
  source-map-js: 1.2.2
patchedDependencies:
  '@privacy-thing/brand@0.2.1': patches/@privacy-thing__brand@0.2.1.patch
