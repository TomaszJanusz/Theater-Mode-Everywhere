name: Translation issue
description: A wrong, unnatural or truncated translation in the extension
title: "[Translation] "
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Polski
        - Čeština
        - Slovenčina
        - Deutsch
        - Español
        - Français
        - Italiano
        - Português (Brasil)
        - Русский
        - Українська
        - 简体中文
        - 日本語
        - 한국어
        - العربية
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where it appears
      description: The screen, setting or player control that shows the text.
      placeholder: "Settings → Appearance → High contrast"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the text exactly as it is shown.
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: How it should read instead. Leave empty if you only want to flag the problem.

  - type: dropdown
    id: problem
    attributes:
      label: What is wrong
      options:
        - Wrong meaning
        - Sounds machine-translated
        - Typo or grammar
        - Too long or truncated
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.3.1"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Why you prefer your wording, or a screenshot of the problem.
