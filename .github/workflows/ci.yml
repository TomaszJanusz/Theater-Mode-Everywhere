name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Only a newer push to the same PR cancels an older run. Pushes to main get a unique group so every
# merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        continue-on-error: true
        run: node scripts/ci-changes.mjs

      - name: Documentation-only changes
        if: steps.changes.outputs.run == 'false'
        run: echo 'Skipping dependency installation, tests, builds and smoke checks for reviewed prose only.'

      - name: Install pnpm
        if: steps.changes.outputs.run != 'false'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        if: steps.changes.outputs.run != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.changes.outputs.run != 'false'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.changes.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.changes.outputs.run != 'false'
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Start virtual audio device
        if: steps.changes.outputs.run != 'false'
        # Firefox needs an audio backend to run a native AudioContext on Linux.
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=theater_tests rate=48000
          pactl set-default-sink theater_tests
          pactl list short sinks

      - name: Typecheck
        if: steps.changes.outputs.run != 'false'
        run: pnpm typecheck

      - name: Build Extension
        if: steps.changes.outputs.run != 'false'
        run: pnpm build
        env:
          CI: true

      - name: Verify Bundles
        if: steps.changes.outputs.run != 'false'
        run: pnpm verify:bundles

      - name: Test
        if: steps.changes.outputs.run != 'false'
        timeout-minutes: 10
        run: pnpm test

      - name: Smoke Chromium
        if: steps.changes.outputs.run != 'false'
        run: xvfb-run --auto-servernum pnpm smoke:chromium

      - name: Smoke Firefox
        if: steps.changes.outputs.run != 'false'
        # Unsigned MV3 sideload is blocked in Playwright; the inject fallback is diagnostic-only.
        continue-on-error: true
        run: xvfb-run --auto-servernum pnpm smoke:firefox
