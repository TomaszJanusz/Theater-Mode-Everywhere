name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      run: ${{ steps.classify.outputs.run }}
      firefox: ${{ steps.classify.outputs.firefox }}
      smoke: ${{ steps.impact.outputs.smoke }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/ci-changes.mjs
      - name: Set up dependencies
        if: steps.classify.outputs.run != 'false'
        uses: $/.github/actions/setup
        timeout-minutes: 4
      - name: Select affected tests
        id: impact
        if: steps.classify.outputs.run != 'false'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          rm -f .test-impact.json
          node scripts/test-impact.mjs || { rm -f .test-impact.json; exit 1; }
      - name: Upload test selection
        if: steps.classify.outputs.run != 'false' && steps.impact.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-selection
          path: .test-impact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Documentation-only changes
        if: steps.classify.outputs.run == 'false'
        run: echo 'Skipping dependency installation, tests, builds and smoke checks for reviewed prose only.'

  # Browser lanes run in a GHCR image (Playwright browsers + PulseAudio) so they never download system
  # packages from the runner's apt mirror. A missing tag, such as after a Playwright bump, is built here.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure browser image
        id: image
        uses: $/.github/actions/ci-image
        timeout-minutes: 12
        with:
          token: ${{ github.token }}

  boundaries:
    needs: changes
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up dependencies
        uses: $/.github/actions/setup
        timeout-minutes: 4
      - name: Check module boundaries
        run: pnpm check:boundaries
        timeout-minutes: 3
      - name: Check host knowledge in shared code
        run: pnpm check:shared-hosts
        timeout-minutes: 3

  css-and-unused:
    needs: changes
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up dependencies
        uses: $/.github/actions/setup
        timeout-minutes: 4
      - name: Check shared CSS ratchet
        run: pnpm lint:css
        timeout-minutes: 3
      - name: Report unused code
        continue-on-error: true
        run: pnpm check:unused
        timeout-minutes: 3

  build:
    needs: changes
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up dependencies
        uses: $/.github/actions/setup
        timeout-minutes: 4
      - name: Build Extension
        run: pnpm build
        timeout-minutes: 5
        env:
          CI: true
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  static:
    needs: [changes, build]
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up dependencies
        uses: $/.github/actions/setup
        timeout-minutes: 4
      - name: Lint
        run: pnpm lint
        timeout-minutes: 5
      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 5
      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-build
          path: dist/
      - name: Verify Bundles
        run: pnpm verify:bundles
        timeout-minutes: 3

  unit:
    needs: changes
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up dependencies
        uses: $/.github/actions/setup
        timeout-minutes: 4
      - name: Download test selection
        if: needs.changes.outputs.smoke != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-selection
      - name: Unit tests
        run: pnpm test --lane=unit --files-from=.test-impact.json --report-dir=test-reports
        timeout-minutes: 8
      - name: Summarize tests
        if: always()
        run: node scripts/ci-test-summary.mjs test-reports
        timeout-minutes: 1

  browser-chromium:
    needs: [changes, image]
    if: needs.changes.outputs.run != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] pinned by digest in the image job
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      # Firefox refuses to start when $HOME (the runner's /github/home) is not owned by the user running it.
      HOME: /root
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up dependencies and Chromium
        uses: $/.github/actions/setup
        timeout-minutes: 4
        with:
          engines: chromium
          prebuilt: 'true'
      - name: Download test selection
        if: needs.changes.outputs.smoke != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-selection
      - name: Storybook components Chromium
        if: matrix.shard == 1
        run: pnpm storybook:test
        timeout-minutes: 5
      - name: Browser tests Chromium
        run: pnpm test --lane=browser --files-from=.test-impact.json --test-shard=${{ matrix.shard }}/3 --shard-costs=scripts/test-shard-costs.chromium.json --report-dir=test-reports
        timeout-minutes: 10
        env:
          THEATER_TEST_ENGINES: chromium
      - name: Summarize tests
        if: always()
        run: node scripts/ci-test-summary.mjs test-reports
        timeout-minutes: 1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-chromium-${{ matrix.shard }}
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 3

  browser-firefox:
    needs: [changes, image]
    if: needs.changes.outputs.run != 'false' && needs.changes.outputs.firefox != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] pinned by digest in the image job
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      # Firefox refuses to start when $HOME (the runner's /github/home) is not owned by the user running it.
      HOME: /root
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # Many browser tests launch Chromium whatever THEATER_TEST_ENGINES selects, so this lane needs it too.
      - name: Set up dependencies and browsers
        uses: $/.github/actions/setup
        timeout-minutes: 4
        with:
          engines: chromium firefox
          audio: 'true'
          prebuilt: 'true'
      - name: Download test selection
        if: needs.changes.outputs.smoke != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-selection
      - name: Storybook components Firefox
        if: matrix.shard == 1
        run: pnpm storybook:test
        timeout-minutes: 5
        env:
          STORYBOOK_BROWSER: firefox
      - name: Browser tests Firefox
        run: pnpm test --lane=browser --files-from=.test-impact.json --test-shard=${{ matrix.shard }}/3 --shard-costs=scripts/test-shard-costs.firefox.json --report-dir=test-reports
        timeout-minutes: 10
        env:
          THEATER_TEST_ENGINES: firefox
      - name: Summarize tests
        if: always()
        run: node scripts/ci-test-summary.mjs test-reports
        timeout-minutes: 1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-firefox-${{ matrix.shard }}
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 3

  smoke:
    needs: [changes, image, build]
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] pinned by digest in the image job
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      # Firefox refuses to start when $HOME (the runner's /github/home) is not owned by the user running it.
      HOME: /root
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up dependencies and browsers
        uses: $/.github/actions/setup
        timeout-minutes: 4
        with:
          engines: ${{ needs.changes.outputs.firefox != 'false' && 'chromium firefox' || 'chromium' }}
          audio: ${{ needs.changes.outputs.firefox != 'false' && 'true' || 'false' }}
          prebuilt: 'true'
      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-build
          path: dist/
      - name: Smoke Chromium
        if: needs.changes.outputs.smoke != 'false'
        run: xvfb-run --auto-servernum pnpm smoke:chromium
        timeout-minutes: 5
      - name: Smoke Firefox
        id: firefox-smoke
        if: needs.changes.outputs.firefox != 'false'
        # Installs the built extension as a temporary add-on. Advisory until it has passed 10 consecutive CI runs (TME-112); the next step keeps a failure visible.
        continue-on-error: true
        run: xvfb-run --auto-servernum pnpm smoke:firefox
        timeout-minutes: 5
      - name: Report Firefox smoke result
        if: ${{ !cancelled() && steps.firefox-smoke.outcome != 'skipped' }}
        timeout-minutes: 1
        env:
          OUTCOME: ${{ steps.firefox-smoke.outcome }}
        run: |
          if [ "$OUTCOME" = failure ]; then
            echo '::warning title=Firefox smoke failed::The installed-extension Firefox smoke failed. It stays non-blocking until it passes 10 consecutive CI runs (TME-112); inspect the Smoke Firefox log.'
            echo '### :warning: Firefox smoke failed (non-blocking)' >> "$GITHUB_STEP_SUMMARY"
            echo 'The installed-extension Firefox smoke failed. It is advisory until it has passed 10 consecutive CI runs (TME-112); inspect the Smoke Firefox log.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Firefox smoke passed (installed extension)' >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    # Preserve the existing aggregate status name for external consumers.
    if: always()
    needs: [changes, image, boundaries, css-and-unused, build, static, unit, browser-chromium, browser-firefox, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report CI result
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_CHECKS: ${{ needs.changes.outputs.run }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const failed = Object.entries(needs).filter(([, job]) => ['failure', 'cancelled'].includes(job.result));
          const required = ['image', 'boundaries', 'css-and-unused', 'build', 'static', 'unit', 'browser-chromium', 'smoke'];
          if (process.env.RUN_CHECKS !== 'false') {
            for (const name of required) if (needs[name].result !== 'success') failed.push([name, needs[name]]);
            if (needs.changes.outputs.firefox !== 'false' && needs['browser-firefox'].result !== 'success') failed.push(['browser-firefox', needs['browser-firefox']]);
          }
          console.log(Object.entries(needs).map(([name, job]) => `${name}: ${job.result}`).join('\n'));
          if (failed.length) process.exitCode = 1;
          NODE
