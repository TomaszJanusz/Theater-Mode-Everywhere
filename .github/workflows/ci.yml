name: CI

on:
  pull_request:

permissions:
  contents: read

# A newer update to the same PR cancels its older run. Merges do not rerun CI;
# nightly Firefox coverage and the release suite cover main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Includes the conditional full Firefox matrix on infrastructure changes.
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        continue-on-error: true
        run: node scripts/ci-changes.mjs

      - name: Documentation-only changes
        if: steps.changes.outputs.run == 'false'
        run: echo 'Skipping dependency installation, tests, builds and smoke checks for reviewed prose only.'

      - name: Install pnpm
        if: steps.changes.outputs.run != 'false'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        if: steps.changes.outputs.run != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.changes.outputs.run != 'false'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.changes.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.changes.outputs.run != 'false'
        env:
          FIREFOX: ${{ steps.changes.outputs.firefox }}
        run: |
          browsers=(chromium)
          if [ "$FIREFOX" != 'false' ]; then browsers+=(firefox); fi
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Start virtual audio device
        if: steps.changes.outputs.run != 'false'
        uses: ./.github/actions/virtual-audio

      - name: Typecheck
        if: steps.changes.outputs.run != 'false'
        run: pnpm typecheck

      - name: Build Extension
        if: steps.changes.outputs.run != 'false'
        run: pnpm build
        env:
          CI: true

      - name: Verify Bundles
        if: steps.changes.outputs.run != 'false'
        run: pnpm verify:bundles

      - name: Unit tests
        if: steps.changes.outputs.run != 'false'
        run: pnpm test --lane=unit

      - name: Test
        if: steps.changes.outputs.run != 'false'
        timeout-minutes: 10
        run: pnpm test --lane=browser
        env:
          THEATER_TEST_ENGINES: chromium

      - name: Test Firefox
        if: steps.changes.outputs.run != 'false' && steps.changes.outputs.firefox != 'false'
        timeout-minutes: 15
        run: pnpm test --lane=browser
        env:
          THEATER_TEST_ENGINES: firefox

      - name: Smoke Chromium
        if: steps.changes.outputs.run != 'false'
        run: xvfb-run --auto-servernum pnpm smoke:chromium

      - name: Smoke Firefox
        id: firefox-smoke
        if: steps.changes.outputs.run != 'false' && steps.changes.outputs.firefox != 'false'
        # Unsigned MV3 sideload is blocked in Playwright; the inject fallback is diagnostic-only.
        # TME-112 owns making this blocking after 10 consecutive green installed-extension runs.
        continue-on-error: true
        run: xvfb-run --auto-servernum pnpm smoke:firefox

      - name: Report Firefox smoke failure
        if: ${{ !cancelled() && steps.firefox-smoke.outcome == 'failure' }}
        run: echo '::warning title=Firefox smoke failed::PR Firefox smoke remains non-blocking pending TME-112 and 10 consecutive green installed-extension runs. The current injection fallback is diagnostic-only; inspect the Smoke Firefox log.'
