name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Start virtual audio device
        # Firefox needs an audio backend to run a native AudioContext on Linux.
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=theater_tests rate=48000
          pactl set-default-sink theater_tests
          pactl list short sinks

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Extension
        run: pnpm build
        env:
          CI: true

      - name: Verify Bundles
        run: pnpm verify:bundles

      - name: Test
        timeout-minutes: 10
        run: pnpm test

      - name: Smoke Chromium
        run: xvfb-run --auto-servernum pnpm smoke:chromium

      - name: Smoke Firefox
        # Unsigned MV3 sideload is blocked in Playwright; the inject fallback is diagnostic-only.
        continue-on-error: true
        run: xvfb-run --auto-servernum pnpm smoke:firefox
