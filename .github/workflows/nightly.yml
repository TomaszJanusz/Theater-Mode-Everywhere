name: Nightly browser coverage

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-browser-coverage
  cancel-in-progress: false

jobs:
  # `dev` is the long-lived 2.1 integration branch (docs/browser-tests.md). The
  # schedule only runs this file from the default branch, so both refs live here.
  # Each job has a literal ref: CodeQL treats an expression-driven checkout as
  # untrusted code beside the default branch's caches. Only the main job uses
  # caches, so dev code never writes to them.
  nightly-main:
    name: Nightly on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Start virtual audio device
        uses: ./.github/actions/virtual-audio

      - name: Build Extension
        run: pnpm build
        env:
          CI: true

      - name: Full test suite
        id: tests
        timeout-minutes: 25
        run: pnpm test

      # main can predate the Storybook pilot until the 2.1 branch lands.
      - name: Storybook components Chromium
        id: components-chromium
        if: ${{ !cancelled() && hashFiles('vitest.config.ts') != '' }}
        timeout-minutes: 5
        run: pnpm storybook:test

      - name: Storybook components Firefox
        id: components-firefox
        if: ${{ !cancelled() && hashFiles('vitest.config.ts') != '' }}
        timeout-minutes: 5
        run: pnpm storybook:test
        env:
          STORYBOOK_BROWSER: firefox

      - name: Smoke Chromium
        id: chromium
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum pnpm smoke:chromium

      - name: Smoke Firefox
        id: firefox
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum pnpm smoke:firefox

      - name: Coverage summary
        if: always()
        env:
          NIGHTLY_REF: main
          TEST_RESULT: ${{ steps.tests.outcome }}
          COMPONENTS_CHROMIUM: ${{ steps.components-chromium.outcome }}
          COMPONENTS_FIREFOX: ${{ steps.components-firefox.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          FIREFOX_RESULT: ${{ steps.firefox.outcome }}
        run: |
          {
            echo "## Nightly coverage on $NIGHTLY_REF"
            echo "Full suite (unit + Chromium + Firefox): $TEST_RESULT"
            echo "Storybook components (Chromium / Firefox): $COMPONENTS_CHROMIUM / $COMPONENTS_FIREFOX"
            echo "Chromium smoke: $CHROMIUM_RESULT"
            echo "Firefox smoke: $FIREFOX_RESULT"
            echo 'Failures fail this job; no test round runs on a merge.'
          } >> "$GITHUB_STEP_SUMMARY"

  nightly-dev:
    name: Nightly on dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Start virtual audio device
        uses: ./.github/actions/virtual-audio

      - name: Build Extension
        run: pnpm build
        env:
          CI: true

      - name: Full test suite
        id: tests
        timeout-minutes: 25
        run: pnpm test

      # main can predate the Storybook pilot until the 2.1 branch lands.
      - name: Storybook components Chromium
        id: components-chromium
        if: ${{ !cancelled() && hashFiles('vitest.config.ts') != '' }}
        timeout-minutes: 5
        run: pnpm storybook:test

      - name: Storybook components Firefox
        id: components-firefox
        if: ${{ !cancelled() && hashFiles('vitest.config.ts') != '' }}
        timeout-minutes: 5
        run: pnpm storybook:test
        env:
          STORYBOOK_BROWSER: firefox

      - name: Smoke Chromium
        id: chromium
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum pnpm smoke:chromium

      - name: Smoke Firefox
        id: firefox
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum pnpm smoke:firefox

      - name: Coverage summary
        if: always()
        env:
          NIGHTLY_REF: dev
          TEST_RESULT: ${{ steps.tests.outcome }}
          COMPONENTS_CHROMIUM: ${{ steps.components-chromium.outcome }}
          COMPONENTS_FIREFOX: ${{ steps.components-firefox.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          FIREFOX_RESULT: ${{ steps.firefox.outcome }}
        run: |
          {
            echo "## Nightly coverage on $NIGHTLY_REF"
            echo "Full suite (unit + Chromium + Firefox): $TEST_RESULT"
            echo "Storybook components (Chromium / Firefox): $COMPONENTS_CHROMIUM / $COMPONENTS_FIREFOX"
            echo "Chromium smoke: $CHROMIUM_RESULT"
            echo "Firefox smoke: $FIREFOX_RESULT"
            echo 'Failures fail this job; no test round runs on a merge.'
          } >> "$GITHUB_STEP_SUMMARY"
